services:
  # ─── Backend ────────────────────────────────────────────
  - type: web
    name: travelmind-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false   # Set this manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false   # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # Set to your frontend Render URL e.g. https://travelmind-frontend.onrender.com

  # ─── Frontend ───────────────────────────────────────────
  - type: web
    name: travelmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set to your backend Render URL e.g. https://travelmind-backend.onrender.com/api
